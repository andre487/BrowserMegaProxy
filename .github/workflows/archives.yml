name: Installation archives
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  archives:
    name: Installation archives
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload Chromium installation archive
        id: chromium
        uses: actions/upload-artifact@v7
        with:
          name: MegaProxy-chromium
          path: dist/chromium/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Firefox installation archive
        id: firefox
        uses: actions/upload-artifact@v7
        with:
          name: MegaProxy-firefox
          path: dist/firefox/
          if-no-files-found: error
          retention-days: 14
      - name: Installation archive download links
        env:
          CHROMIUM_ARCHIVE_URL: ${{ steps.chromium.outputs.artifact-url }}
          FIREFOX_ARCHIVE_URL: ${{ steps.firefox.outputs.artifact-url }}
        run: |
          {
            echo '## MegaProxy installation archives'
            echo
            echo "- [Chromium ZIP]($CHROMIUM_ARCHIVE_URL)"
            echo "- [Firefox ZIP]($FIREFOX_ARCHIVE_URL)"
            echo
            echo 'Extract the ZIP and load the extension from its manifest.json. Firefox builds are unsigned temporary add-ons. Artifacts expire after 14 days.'
          } >> "$GITHUB_STEP_SUMMARY"
