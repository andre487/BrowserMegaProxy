name: Release extension artifacts
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish after recovery
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish extension archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$expected" || { echo 'Release tag must match package.json'; exit 1; }
          test -s "releases/$RELEASE_TAG.md" || { echo 'Committed EN/RU release notes are required'; exit 1; }
      - run: npx playwright install --with-deps chromium firefox
      - name: Build extension and fresh store assets
        run: npm run store:assets
      - name: Package archives and checksums
        run: npm run release:assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          assets=(dist/release/*.zip dist/release/SHA256SUMS)
          notes="$RUNNER_TEMP/release-notes.md"
          cat "releases/$RELEASE_TAG.md" > "$notes"
          printf '\nChromium ZIP: Chrome / Opera developer installation or store submission. Firefox ZIP: unsigned, for temporary installation or submission to Mozilla for signing. Source ZIP: reproducible source for review. Store-materials ZIP: EN/RU listings, screenshots, icons and privacy documentation. SHA256SUMS covers all four archives.\n' >> "$notes"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$notes" --title "MegaProxy $RELEASE_TAG"
          fi
