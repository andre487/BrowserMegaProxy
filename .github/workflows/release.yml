name: Release extension artifacts
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      dry_run:
        description: Check an existing release and store access without publishing
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish after recovery
        required: true
        type: string
      dry_run:
        description: Check an existing release and store access without publishing
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish extension archives
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$expected" || { echo 'Release tag must match package.json'; exit 1; }
          test -s "releases/$RELEASE_TAG.md" || { echo 'Committed EN/RU release notes are required'; exit 1; }
      - run: npx playwright install --with-deps chromium firefox
      - name: Build extension and fresh store assets
        run: npm run store:assets
      - name: Package archives and checksums
        run: npm run release:assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          assets=(dist/release/*.zip dist/release/SHA256SUMS)
          notes="releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$notes" --title "MegaProxy $RELEASE_TAG"
          fi
  opera-addons:
    name: Submit to Opera Add-ons
    needs: release
    if: ${{ !cancelled() && vars.OPERA_PUBLISH_ENABLED != 'false' && (needs.release.result == 'success' || (inputs.dry_run && needs.release.result == 'skipped')) }}
    uses: ./.github/workflows/opera-addons.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
  chrome-web-store:
    name: Submit to Chrome Web Store
    needs: release
    if: ${{ !cancelled() && (vars.CWS_PUBLISH_ENABLED == 'true' || inputs.dry_run) && (needs.release.result == 'success' || (inputs.dry_run && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    steps:
      # Use publishing code from the workflow revision, including for recovery of older tags.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Download released Chromium archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "MegaProxy-chromium-$RELEASE_TAG.zip" --dir dist/release
      - name: Upload and submit for review
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: kfilelfnldddoncicbampiojjjcpbigo
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/chrome-web-store.mjs "$RELEASE_TAG"
