name: Extension checks
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Unit test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: test-results/unit.xml
          show: all
          folded: true
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            test-results/unit.xml
            test-results/unit.txt
          retention-days: 7
  browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            name: Chromium tests
          - browser: firefox
            name: Firefox tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
          cache-python: true
          cache-dependency-glob: tests/megaproxy-server/versions.json
      - run: npm ci
      - run: npm run build
      - name: Store assets, Playwright and real MegaProxyServer
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          playwright_version=$(node -p 'require("@playwright/test/package.json").version')
          # Keep host paths and networking: server fixtures bind-mount files and publish localhost ports.
          # Native launcher checks also exercise the runner's installed Google Chrome and its sandbox.
          docker run --rm --init --ipc=host --network=host \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /opt/google/chrome:/opt/google/chrome:ro \
            --volume "$(command -v docker):/usr/local/bin/docker:ro" \
            --volume "$(command -v uv):/usr/local/bin/uv:ro" \
            --volume "$(command -v node):/usr/local/bin/node:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env CI=true --env TEST_BROWSER \
            --env npm_config_cache=/tmp/npm-cache --env XDG_CACHE_HOME=/tmp/cache \
            --env UV_CACHE_DIR --env UV_PYTHON_INSTALL_DIR --env UV_PYTHON \
            --env UV_PYTHON_PREFERENCE=only-managed \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" \
            bash -euc '
              if [ "$TEST_BROWSER" = chromium ]; then npm run store:assets; fi
              npm run test:e2e -- --project="$TEST_BROWSER"
            '
      - name: Browser test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: test-results/playwright.xml
          show: all
          folded: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
